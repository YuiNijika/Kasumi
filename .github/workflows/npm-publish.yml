name: Recover npm publication

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub Release tag
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm version:sync
      - run: pnpm version:check
      - run: pnpm test:packages
      - run: pnpm test:tarballs
      - run: pnpm typecheck
      - run: pnpm build:bridge
      - name: Verify GitHub Release manifest
        run: |
          VERSION="${RELEASE_TAG#v}"
          python tools/check_release_version.py "$VERSION"
          curl --fail --silent --show-error --location \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/kasumi-release.json" \
            --output "$RUNNER_TEMP/kasumi-release.json"
          python - "$VERSION" "$RUNNER_TEMP/kasumi-release.json" <<'PY'
          import json
          import sys

          version, manifest_path = sys.argv[1:]
          with open(manifest_path, encoding="utf-8") as handle:
              manifest = json.load(handle)
          if manifest.get("version") != version:
              raise SystemExit(
                  f"release manifest version {manifest.get('version')} does not match {version}"
              )
          assets = manifest.get("assets", {})
          for name in ("windowsSdk", "androidMaven"):
              if not assets.get(name, {}).get("file"):
                  raise SystemExit(f"release manifest is missing {name}")
          PY
      - name: Resolve npm dist-tag
        run: |
          VERSION="${RELEASE_TAG#v}"
          NPM_TAG=latest
          if [[ "$VERSION" == "26.11.6" ]]; then
            NPM_TAG=rc
          elif [[ "$VERSION" == *-* ]]; then
            NPM_TAG="${VERSION#*-}"
            NPM_TAG="${NPM_TAG%%.*}"
          fi
          echo "NPM_TAG=$NPM_TAG" >> "$GITHUB_ENV"
      - name: Publish kasumi-bridge
        run: pnpm --filter kasumi-bridge publish --provenance --access public --tag "$NPM_TAG" --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish kasumi-plugin-fs
        run: pnpm --filter kasumi-plugin-fs publish --provenance --access public --tag "$NPM_TAG" --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish kasumi-plugin-dialog
        run: pnpm --filter kasumi-plugin-dialog publish --provenance --access public --tag "$NPM_TAG" --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish kasumi-plugin-clipboard
        run: pnpm --filter kasumi-plugin-clipboard publish --provenance --access public --tag "$NPM_TAG" --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish kasumi-plugin-notification
        run: pnpm --filter kasumi-plugin-notification publish --provenance --access public --tag "$NPM_TAG" --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish kasumi-plugin-window
        run: pnpm --filter kasumi-plugin-window publish --provenance --access public --tag "$NPM_TAG" --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish kasumi-plugin-http
        run: pnpm --filter kasumi-plugin-http publish --provenance --access public --tag "$NPM_TAG" --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish kasumi-plugin-shell
        run: pnpm --filter kasumi-plugin-shell publish --provenance --access public --tag "$NPM_TAG" --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish kasumi-plugin-device
        run: pnpm --filter kasumi-plugin-device publish --provenance --access public --tag "$NPM_TAG" --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish kasumi-plugin-sql
        run: pnpm --filter kasumi-plugin-sql publish --provenance --access public --tag "$NPM_TAG" --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish kasumi-plugin-path
        run: pnpm --filter kasumi-plugin-path publish --provenance --access public --tag "$NPM_TAG" --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish kasumi-plugin-store
        run: pnpm --filter kasumi-plugin-store publish --provenance --access public --tag "$NPM_TAG" --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish kasumi-plugin-os
        run: pnpm --filter kasumi-plugin-os publish --provenance --access public --tag "$NPM_TAG" --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish kasumi-plugin-log
        run: pnpm --filter kasumi-plugin-log publish --provenance --access public --tag "$NPM_TAG" --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish kasumi-plugin-updater
        run: pnpm --filter kasumi-plugin-updater publish --provenance --access public --tag "$NPM_TAG" --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish kasumi-plugin-global-shortcut
        run: pnpm --filter kasumi-plugin-global-shortcut publish --provenance --access public --tag "$NPM_TAG" --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish kasumi-plugin-tray
        run: pnpm --filter kasumi-plugin-tray publish --provenance --access public --tag "$NPM_TAG" --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish kasumi-plugin-audio
        run: pnpm --filter kasumi-plugin-audio publish --provenance --access public --tag "$NPM_TAG" --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish kasumi-plugin-media-session
        run: pnpm --filter kasumi-plugin-media-session publish --provenance --access public --tag "$NPM_TAG" --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish kasumi-cli
        run: pnpm --filter kasumi-cli publish --provenance --access public --tag "$NPM_TAG" --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish create-kasumi
        run: pnpm --filter create-kasumi publish --provenance --access public --tag "$NPM_TAG" --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify published versions
        run: |
          VERSION="${RELEASE_TAG#v}"
          for package in kasumi-bridge kasumi-plugin-fs kasumi-plugin-dialog kasumi-plugin-clipboard kasumi-plugin-notification kasumi-plugin-window kasumi-plugin-http kasumi-plugin-shell kasumi-plugin-device kasumi-plugin-sql kasumi-plugin-path kasumi-plugin-store kasumi-plugin-os kasumi-plugin-log kasumi-plugin-updater kasumi-plugin-global-shortcut kasumi-plugin-tray kasumi-plugin-audio kasumi-plugin-media-session kasumi-cli create-kasumi
          do
            test "$(npm view "$package@$NPM_TAG" version)" = "$VERSION"
          done
