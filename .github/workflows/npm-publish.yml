name: Recover npm publication

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published GitHub Release tag
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:packages
      - run: pnpm test:tarballs
      - run: pnpm typecheck
      - run: pnpm build:bridge
      - name: Verify GitHub Release manifest
        run: |
          VERSION="${RELEASE_TAG#v}"
          python tools/check_release_version.py "$VERSION"
          curl --fail --silent --show-error --location \
            "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/kasumi-release.json" \
            --output "$RUNNER_TEMP/kasumi-release.json"
          python - "$VERSION" "$RUNNER_TEMP/kasumi-release.json" <<'PY'
          import json
          import sys

          version, manifest_path = sys.argv[1:]
          with open(manifest_path, encoding="utf-8") as handle:
              manifest = json.load(handle)
          if manifest.get("version") != version:
              raise SystemExit(
                  f"release manifest version {manifest.get('version')} does not match {version}"
              )
          assets = manifest.get("assets", {})
          for name in ("windowsSdk", "androidMaven"):
              if not assets.get(name, {}).get("file"):
                  raise SystemExit(f"release manifest is missing {name}")
          PY
      - name: Resolve npm dist-tag
        run: |
          VERSION="${RELEASE_TAG#v}"
          NPM_TAG=latest
          if [[ "$VERSION" == *-* ]]; then
            NPM_TAG="${VERSION#*-}"
            NPM_TAG="${NPM_TAG%%.*}"
          fi
          echo "NPM_TAG=$NPM_TAG" >> "$GITHUB_ENV"
      - name: Publish kasumi-bridge
        run: pnpm --filter kasumi-bridge publish --provenance --access public --tag "$NPM_TAG" --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish kasumi-cli
        run: pnpm --filter kasumi-cli publish --provenance --access public --tag "$NPM_TAG" --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish create-kasumi
        run: pnpm --filter create-kasumi publish --provenance --access public --tag "$NPM_TAG" --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify published versions
        run: |
          VERSION="${RELEASE_TAG#v}"
          for package in kasumi-bridge kasumi-cli create-kasumi
          do
            test "$(npm view "$package@$NPM_TAG" version)" = "$VERSION"
          done
