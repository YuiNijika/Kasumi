name: Publish npm packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm test:packages
      - run: pnpm build:bridge
      - name: Verify tag version
        if: startsWith(github.ref, 'refs/tags/')
        run: python tools/check_release_version.py "${GITHUB_REF_NAME#v}"
        shell: bash
      - name: Publish kasumi-bridge
        run: pnpm --filter kasumi-bridge publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish kasumi-cli
        run: pnpm --filter kasumi-cli publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish create-kasumi
        run: pnpm --filter create-kasumi publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
