name: Kasumi release packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache-dependency-path: frontend/package.json
      - run: pnpm --dir frontend install --no-frozen-lockfile
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
      - run: python cli/ksm.py package --platform windows
        env:
          CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
      - name: Decode Authenticode certificate
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            throw "WINDOWS_CERTIFICATE_BASE64 is required for tagged Windows releases."
          }
          $certificate = Join-Path $env:RUNNER_TEMP "kasumi-authenticode.pfx"
          [IO.File]::WriteAllBytes(
            $certificate,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          )
      - name: Sign and verify Windows package
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "WINDOWS_CERTIFICATE_PASSWORD is required for tagged Windows releases."
          }
          $zip = Get-ChildItem "windows/build/packages/*.zip" | Select-Object -First 1
          if ($null -eq $zip) {
            throw "The Windows package ZIP was not produced."
          }
          $stage = Join-Path $env:RUNNER_TEMP "kasumi-windows-sign"
          if (Test-Path $stage) {
            Remove-Item -LiteralPath $stage -Recurse -Force
          }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $stage
          $required = @(
            @{ Name = "kasumi_win32_example.exe"; Label = "example executable" },
            @{ Name = "kasumi_windows_bridge.lib"; Label = "static library" },
            @{ Name = "index.html"; Label = "example web page" },
            @{ Name = "ksm_webview2_host.h"; Label = "public WebView2 header" },
            @{ Name = "README.md"; Label = "package readme" }
          )
          foreach ($item in $required) {
            $found = Get-ChildItem -LiteralPath $stage -Recurse -File -Filter $item.Name |
              Select-Object -First 1
            if ($null -eq $found) {
              throw "The Windows package is missing the $($item.Label)."
            }
          }
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Filter signtool.exe -Recurse -File |
            Where-Object { $_.FullName -match "\\x64\\signtool\.exe$" } |
            Sort-Object FullName |
            Select-Object -Last 1
          if ($null -eq $signtool) {
            throw "signtool.exe was not found in the Windows SDK."
          }
          $certificate = Join-Path $env:RUNNER_TEMP "kasumi-authenticode.pfx"
          $binaries = Get-ChildItem $stage -Recurse -File |
            Where-Object { $_.Extension -in @(".exe", ".dll") }
          if ($binaries.Count -eq 0) {
            throw "No Windows binaries were found to sign."
          }
          foreach ($binary in $binaries) {
            & $signtool.FullName sign /fd SHA256 /td SHA256 /tr "http://timestamp.digicert.com" /f $certificate /p $env:WINDOWS_CERTIFICATE_PASSWORD $binary.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Signing failed for $($binary.FullName)."
            }
            & $signtool.FullName verify /pa /all $binary.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Signature verification failed for $($binary.FullName)."
            }
          }
          Remove-Item -LiteralPath $zip.FullName -Force
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zip.FullName
      - uses: actions/upload-artifact@v4
        with:
          name: kasumi-windows-package
          path: windows/build/packages/*.zip
          if-no-files-found: error

  android-package:
    runs-on: ubuntu-latest
    env:
      KASUMI_ANDROID_KEYSTORE: ${{ github.workspace }}/release.keystore
      KASUMI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KASUMI_ANDROID_KEYSTORE_PASSWORD }}
      KASUMI_ANDROID_KEY_ALIAS: ${{ secrets.KASUMI_ANDROID_KEY_ALIAS }}
      KASUMI_ANDROID_KEY_PASSWORD: ${{ secrets.KASUMI_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache-dependency-path: frontend/package.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - run: pnpm --dir frontend install --no-frozen-lockfile
      - name: Decode Android signing key
        env:
          KASUMI_ANDROID_KEYSTORE_BASE64: ${{ secrets.KASUMI_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KASUMI_ANDROID_KEYSTORE_BASE64" ]; then
            echo "KASUMI_ANDROID_KEYSTORE_BASE64 is required for release packages."
            exit 1
          fi
          printf '%s' "$KASUMI_ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
      - run: python cli/ksm.py package --platform android
      - name: Verify release signature
        run: |
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs android/app/build/outputs/apk/release/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: kasumi-android-package
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
