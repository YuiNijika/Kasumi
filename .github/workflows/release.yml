name: Kasumi release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release secrets
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          KASUMI_ANDROID_KEYSTORE_BASE64: ${{ secrets.KASUMI_ANDROID_KEYSTORE_BASE64 }}
          KASUMI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KASUMI_ANDROID_KEYSTORE_PASSWORD }}
          KASUMI_ANDROID_KEY_ALIAS: ${{ secrets.KASUMI_ANDROID_KEY_ALIAS }}
          KASUMI_ANDROID_KEY_PASSWORD: ${{ secrets.KASUMI_ANDROID_KEY_PASSWORD }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "Skipping release secret validation for a non-tag run."
            exit 0
          fi

          missing=0
          for name in \
            WINDOWS_CERTIFICATE_BASE64 \
            WINDOWS_CERTIFICATE_PASSWORD \
            KASUMI_ANDROID_KEYSTORE_BASE64 \
            KASUMI_ANDROID_KEYSTORE_PASSWORD \
            KASUMI_ANDROID_KEY_ALIAS \
            KASUMI_ANDROID_KEY_PASSWORD \
            NPM_TOKEN
          do
            if [[ -z "${!name}" ]]; then
              echo "::error title=Missing release secret::$name is required for tagged releases."
              missing=1
            fi
          done
          exit "$missing"

  windows-package:
    needs: release-preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm version:sync
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v', ''
          python tools/check_release_version.py $version
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          vcpkgJsonGlob: windows/vcpkg.json
      - name: Build Windows SDK and example
        run: pnpm ksm package --windows
        env:
          CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
      - name: Decode Authenticode certificate
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            throw "WINDOWS_CERTIFICATE_BASE64 is required for tagged Windows releases."
          }
          $certificate = Join-Path $env:RUNNER_TEMP "kasumi-authenticode.pfx"
          [IO.File]::WriteAllBytes(
            $certificate,
            [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64)
          )
      - name: Sign and verify Windows example
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_PASSWORD)) {
            throw "WINDOWS_CERTIFICATE_PASSWORD is required for tagged Windows releases."
          }
          $zip = Get-ChildItem ".ksm/release/app/*/kasumi-win32-example-*.zip" |
            Select-Object -First 1
          if ($null -eq $zip) {
            throw "The Windows example ZIP was not produced."
          }
          $stage = Join-Path $env:RUNNER_TEMP "kasumi-windows-sign"
          if (Test-Path $stage) {
            Remove-Item -LiteralPath $stage -Recurse -Force
          }
          Expand-Archive -LiteralPath $zip.FullName -DestinationPath $stage
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Filter signtool.exe -Recurse -File |
            Where-Object { $_.FullName -match "\\x64\\signtool\.exe$" } |
            Sort-Object FullName |
            Select-Object -Last 1
          if ($null -eq $signtool) {
            throw "signtool.exe was not found in the Windows SDK."
          }
          $certificate = Join-Path $env:RUNNER_TEMP "kasumi-authenticode.pfx"
          $binaries = Get-ChildItem $stage -Recurse -File |
            Where-Object { $_.Extension -in @(".exe", ".dll") }
          if ($binaries.Count -eq 0) {
            throw "No Windows binaries were found to sign."
          }
          foreach ($binary in $binaries) {
            & $signtool.FullName sign /fd SHA256 /td SHA256 /tr "http://timestamp.digicert.com" /f $certificate /p $env:WINDOWS_CERTIFICATE_PASSWORD $binary.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Signing failed for $($binary.FullName)."
            }
            & $signtool.FullName verify /pa /all $binary.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Signature verification failed for $($binary.FullName)."
            }
          }
          Remove-Item -LiteralPath $zip.FullName -Force
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zip.FullName
      - uses: actions/upload-artifact@v4
        with:
          name: kasumi-windows-sdk
          path: .ksm/release/kasumi
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: kasumi-windows-example
          path: .ksm/release/app
          include-hidden-files: true
          if-no-files-found: error

  android-package:
    needs: release-preflight
    runs-on: ubuntu-latest
    env:
      KASUMI_ANDROID_KEYSTORE: ${{ github.workspace }}/release.keystore
      KASUMI_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.KASUMI_ANDROID_KEYSTORE_PASSWORD }}
      KASUMI_ANDROID_KEY_ALIAS: ${{ secrets.KASUMI_ANDROID_KEY_ALIAS }}
      KASUMI_ANDROID_KEY_PASSWORD: ${{ secrets.KASUMI_ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - run: pnpm install --frozen-lockfile
      - run: pnpm version:sync
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        run: python tools/check_release_version.py "${GITHUB_REF_NAME#v}"
      - name: Decode Android signing key
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KASUMI_ANDROID_KEYSTORE_BASE64: ${{ secrets.KASUMI_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KASUMI_ANDROID_KEYSTORE_BASE64" ]; then
            echo "KASUMI_ANDROID_KEYSTORE_BASE64 is required for tagged Android releases."
            exit 1
          fi
          printf '%s' "$KASUMI_ANDROID_KEYSTORE_BASE64" | base64 --decode > release.keystore
      - name: Validate Android signing configuration
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          for name in \
            KASUMI_ANDROID_KEYSTORE_PASSWORD \
            KASUMI_ANDROID_KEY_ALIAS \
            KASUMI_ANDROID_KEY_PASSWORD
          do
            if [ -z "${!name}" ]; then
              echo "$name is required for tagged Android releases."
              exit 1
            fi
          done
      - run: pnpm ksm package --android --target sdk
      - name: Build signed example APK
        if: startsWith(github.ref, 'refs/tags/')
        run: bash examples/android-host/gradlew -p examples/android-host :app:assembleRelease
      - name: Package signed example APK
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p ".ksm/release/app/$VERSION"
          cp examples/android-host/app/build/outputs/apk/release/app-release.apk \
            ".ksm/release/app/$VERSION/kasumi-android-example-$VERSION.apk"
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs ".ksm/release/app/$VERSION/kasumi-android-example-$VERSION.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: kasumi-android-sdk
          path: .ksm/release/kasumi
          include-hidden-files: true
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: kasumi-android-example
          path: .ksm/release/app
          include-hidden-files: true
          if-no-files-found: error

  release-assets:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - windows-package
      - android-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: kasumi-*-sdk
          path: .ksm/release/kasumi
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: kasumi-*-example
          path: .ksm/release/app
          merge-multiple: true
      - name: Build release manifest
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python tools/check_release_version.py "$VERSION"
          WINDOWS_SDK=$(find ".ksm/release/kasumi/$VERSION" -name "kasumi-windows-sdk-*.zip" -print -quit)
          ANDROID_MAVEN=$(find ".ksm/release/kasumi/$VERSION" -name "kasumi-android-maven-*.zip" -print -quit)
          python tools/release_manifest.py \
            --version "$VERSION" \
            --windows-sdk "$WINDOWS_SDK" \
            --android-maven "$ANDROID_MAVEN" \
            --output ".ksm/release/kasumi/$VERSION/kasumi-release.json"
      - uses: softprops/action-gh-release@v2
        with:
          body_path: .github/release-notes/${{ github.ref_name }}.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          make_latest: ${{ !contains(github.ref_name, '-') }}
          files: |
            .ksm/release/kasumi/*/*
            .ksm/release/app/*/*
          fail_on_unmatched_files: true

  npm-publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: release-assets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm version:sync
      - run: pnpm test:packages
      - run: pnpm test:tarballs
      - run: pnpm typecheck
      - run: pnpm build:bridge
      - name: Verify release version
        run: python tools/check_release_version.py "${GITHUB_REF_NAME#v}"
      - name: Resolve npm dist-tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NPM_TAG=latest
          if [[ "$VERSION" == *-* ]]; then
            NPM_TAG="${VERSION#*-}"
            NPM_TAG="${NPM_TAG%%.*}"
          fi
          echo "NPM_TAG=$NPM_TAG" >> "$GITHUB_ENV"
      - name: Publish kasumi-bridge
        run: pnpm --filter kasumi-bridge publish --provenance --access public --tag "$NPM_TAG" --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish kasumi-cli
        run: pnpm --filter kasumi-cli publish --provenance --access public --tag "$NPM_TAG" --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish create-kasumi
        run: pnpm --filter create-kasumi publish --provenance --access public --tag "$NPM_TAG" --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Verify published versions
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for package in kasumi-bridge kasumi-cli create-kasumi
          do
            test "$(npm view "$package@$NPM_TAG" version)" = "$VERSION"
          done
