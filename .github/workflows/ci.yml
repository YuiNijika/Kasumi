name: Kasumi CI

on:
  push:
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm codegen
      - run: pnpm validate:protocol
      - run: pnpm typecheck
      - run: pnpm test:contract
      - run: pnpm test:packages
      - run: pnpm build:bridge
      - uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
      - run: cmake -S windows -B windows/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
      - run: cmake --build windows/build --config Release
      - run: ctest --test-dir windows/build -C Release --output-on-failure

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm codegen
      - run: pnpm validate:protocol
      - run: pnpm typecheck
      - run: pnpm test:contract
      - run: pnpm test:packages
      - run: pnpm build:bridge
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - run: gradle -p android testDebugUnitTest assembleDebug assembleDebugAndroidTest
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: gradle -p android connectedDebugAndroidTest
